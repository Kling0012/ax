schema_version: 1
id: discord-forward
version: 1.0.0
kind: timer
project: multi
title: Discord forwarding
image: ax/runtime:1.0.0
execution: mechanical
schedule: {kind: interval, every_s: 300, missed: record_only}
capabilities: [run, collect_only, poll_paused, draining]
default_mode: collect_only
collect_only_handler: true
knobs: {}
health: {heartbeat_s: 60}
sensitivity: public
secrets: []
outputs: [discord.send]
depends_on_plugins: [control, resources, timeline, ledger]
env_jobs:
  operations: [submit, get]
  entrypoints: [x-user-posts]
  requires: [x-session]
