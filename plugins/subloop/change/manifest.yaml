schema_version: 1
id: change
version: 1.0.0
kind: subloop
project: multi
title: Issue と PR を受け付けて検証とマージを進める
image: ax/runtime:1.0.0
execution: llm
schedule: {kind: interval, every_s: 300, missed: record_only}
graph: graph.yaml
capabilities: [run, collect_only, poll_paused, draining]
knobs:
  dry_run: {type: boolean, default: true, effective: next_run, title: 外部操作を予定だけにする, who: [user]}
  max_parallel_items: {type: integer, default: 1, min: 1, max: 4, effective: next_run, title: 同時に進める項目の上限, who: [inspection, user]}
  every_s: {type: integer, default: 300, min: 60, max: 3600, effective: next_run, title: 巡回の間隔, who: [inspection, user]}
  max_hops: {type: integer, default: 20, min: 2, max: 20, effective: next_run, title: 項目の再入場の上限, who: [inspection, user]}
  change_starts_per_cycle: {type: integer, default: 4, min: 1, max: 8, effective: next_run, title: 一巡で起動する項目の上限, who: [inspection, user]}
  change_model_calls_per_cycle: {type: integer, default: 30, min: 1, max: 60, effective: next_run, title: 一巡のモデル呼出数の上限, who: [inspection, user]}
  change_cycle_seconds: {type: integer, default: 300, min: 30, max: 600, effective: next_run, title: 一巡の時間の上限, who: [inspection, user]}
  change_fix_rounds: {type: integer, default: 3, min: 1, max: 3, effective: next_run, title: 修正ラウンドの上限, who: [inspection, user]}
  test_cases_max: {type: integer, default: 12, min: 3, max: 30, effective: next_run, title: 変更のテスト件数の上限, who: [inspection, user]}
health: {heartbeat_s: 60}
sensitivity: private
roles: [screen, research, test_design, impl, impl_hard, review]
secrets: [github-token]
outputs: [github.comment, github.pr_update, github.merge, git.push, release.pending]
depends_on_plugins: [worker-pool]
