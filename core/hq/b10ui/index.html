<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AX 管理画面</title>
  <link rel="stylesheet" href="/b10/style.css">
  <script src="/b10/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header>
      <div><p class="eyebrow" data-number>AX / HQ</p><h1 data-number>管理画面</h1><p class="intro" data-number>予定と作業の状態を確認できます。</p></div>
      <div class="actions"><button id="numbers" type="button" aria-pressed="false" data-number>番号を表示 <kbd>Alt+N</kbd></button><button id="refresh" type="button" data-number>更新</button></div>
    </header>
    <main>
      <section aria-labelledby="schedule-title"><div class="section-head"><div><p class="eyebrow" data-number>予定</p><h2 id="schedule-title" data-number>管理下の予定</h2><p class="hint" data-number>時刻は日本時間です。</p></div><span class="state" id="schedule-state" data-number role="status">取得中</span></div><div id="schedules" class="items" aria-live="polite"></div></section>
      <section aria-labelledby="todo-title"><div class="section-head"><div><p class="eyebrow" data-number>確認</p><h2 id="todo-title" data-number>ToDo</h2></div><span class="state" id="todo-state" data-number role="status">取得中</span></div><div id="todos" class="items" aria-live="polite"></div></section>
      <section aria-labelledby="pool-title"><div class="section-head"><div><p class="eyebrow" data-number>ワーカー</p><h2 id="pool-title" data-number>作業状況</h2></div><span class="state" id="pool-state" data-number role="status">取得中</span></div><div id="pool" class="items" aria-live="polite"></div></section>
      <section aria-labelledby="slots-title"><div class="section-head"><div><p class="eyebrow" data-number>利用枠</p><h2 id="slots-title" data-number>枠の状態</h2></div><span class="state" id="slots-state" data-number role="status">取得中</span></div><div id="slots" class="items" aria-live="polite"></div></section>
      <section aria-labelledby="selections-title"><div class="section-head"><div><p class="eyebrow" data-number>選択</p><h2 id="selections-title" data-number>モデルの選択理由</h2></div><span class="state" id="selections-state" data-number role="status">取得中</span></div><div id="selections" class="items" aria-live="polite"></div></section>
    </main>
    <footer data-number>番号は Alt+N でも切り替えられます。</footer>
  </div>
</body>
</html>
