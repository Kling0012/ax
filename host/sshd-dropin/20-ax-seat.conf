# F-9.3. Validate sshd -t and compare sshd -T for all three users before reload.
Match User ax-seat
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /var/lib/ax-seat/.ssh/authorized_keys
    AuthorizedKeysCommand none
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY yes
    PermitUserRC no
    PermitUserEnvironment no
    ExposeAuthInfo yes
    MaxSessions 4
Match all
